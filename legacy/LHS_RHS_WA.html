<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./LHS_RHS.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LHS/RHS</title>
    <!-- #include virtual="/imports.html" -->

    <link rel="stylesheet" href="/webawesome.css" />
    <script type="module" src="https://early.webawesome.com/webawesome@3.0.0-beta.4/dist/webawesome.loader.js"></script>

    <template id=dirs-files>
        <ul itemscope=Scope itemprop=subDirs>
            <li per-each="CompDirInfo of Scope">
                <details>
                    <summary itemprop=nameToDisplay></summary>
                    <template 🎚️="on when ^{details}." rel=preload src=#dirs-files></template>
                </details>
            </li>
        </ul>
        <ul itemscope=Scope itemprop=files>
            <li per-each="CompFileInfo of Scope">
                <span itemprop=nameToDisplay></span>
                <button name=delete>Delete</button>
            </li>
        </ul>        
    </template>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>
                    <button name=lhsDirPick disabled>Pick LHS directory</button>
                </th>
                <th>
                    <button name=rhsDirPick disabled>Pick RHS directory</button>
                </th>
            </tr>
            <tr>
                <th>Left Hand Side</th>
                <th>Right Hand Side</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- lhs -->
                <td>
                    <details itemscope=CompDirInfo 
                        be-enhancing="
                            @lhsDirPick with 📁⛏️ and set $0?.ish?.myHandle to directoryHandle.
                            @rhsDirPick with 📁⛏️ and set $0?.ish?.yourHandle to directoryHandle.
                        ">
                        <summary itemprop=nameToDisplay></summary>
                        <template 🎚️="on when ^{details}." rel=preload src=#dirs-files></template>
                    </details>
                </td>
                <!-- rhs -->
                <td>
                    <wa-tree class="tree-with-icons">
                        <wa-tree-item itemscope=CompDirInfo
                        be-enhancing="
                            @rhsDirPick with 📁⛏️ and set $0?.ish?.myHandle to directoryHandle.
                            @lhsDirPick with 📁⛏️ and set $0?.ish?.yourHandle to directoryHandle.
                        ">
                            <wa-icon name="folder" variant="regular"></wa-icon>
                            <span itemprop=nameToDisplay></span>
                            <template 🎚️="on when ^{wa-tree-item}?.expanded::wa-expand." rel=preload src=#dirs-files></template>
                        </wa-tree-item>
                    </wa-tree>
                    <!-- <details itemscope=CompDirInfo 
                        be-enhancing="
                            @rhsDirPick with 📁⛏️ and set $0?.ish?.myHandle to directoryHandle.
                            @lhsDirPick with 📁⛏️ and set $0?.ish?.yourHandle to directoryHandle.
                        ">
                        <summary itemprop=nameToDisplay></summary>
                        <template 🎚️="on when ^{details}." rel=preload src=#dirs-files></template>
                    </details> -->
                </td>
            </tr>
        </tbody>
    </table>

    <script type=module>
        import 'folder-picker/📁⛏️.js';
        import 'be-enhancing/emc.js';
        
        import 'per-each/emc.js';
        import { regIsh } from 'mount-observer/refid/regIsh.js';
        import 'be-switched/🎚️.js';

        import { CompDirInfo } from '/CompDirInfo/CompDirInfo.js';
        regIsh(document.body, 'CompDirInfo', CompDirInfo);

        import { CompFileInfo } from '/CompFileInfo/CompFileInfo.js';
        regIsh(document.body, 'CompFileInfo', CompFileInfo);

        import {Scope} from 'trans-render/froop/Scope.js';
        regIsh(document.body, 'Scope', Scope);

    </script>
</body>
</html>
