<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./LHS_RHS.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LHS/RHS</title>
    <!-- #include virtual="/imports.html" -->
    <template id=dirs-files>
        <ul itemscope=Scope itemprop=subDirs>
            <li per-each="CompDirInfo of Scope">
                <details #>
                    <summary itemprop=nameToDisplay></summary>
                    <template -id defer-🎚️ 🎚️="on when #{{details}}." rel=preload src=#dirs-files></template>
                </details>
            </li>
        </ul>
        <ul itemscope=Scope itemprop=files>
            <li per-each="CompFileInfo of Scope">
                <div>
                    <span itemprop=nameToDisplay></span>
                    <button name=delete>×</button>
                </div>
                

            </li>
        </ul>        
    </template>
    <script>
        function testCloning(){
            // const obj = {
            //     a: 13,
            //     b: 2,
            //     c: 3,
            //     add: (a, b) => a + b,
            // };
            // console.log(obj.a, obj.add(obj.a,obj.b));
            // const clone = structuredClone(obj);
            // debugger;
            // console.log(clone.a, clone.add(2,3));
            debugger;
            const directoryHandle = document.querySelector('[itemscope="CompDirInfo"]').ish.myHandle;
            const myWorker = new Worker("/worker.js");
            myWorker.postMessage({directoryHandle});
        }
    </script>
</head>
<body>
    <button onclick="testCloning()">Test Cloning</button>
    <table class=LRTable>
        <thead>
            <tr>
                <th>
                    <button id=lhsDirPick disabled>Pick LHS directory</button>
                </th>
                <th>
                    <button id=rhsDirPick disabled>Pick RHS directory</button>
                </th>
            </tr>
            <tr>
                <th>Left Hand Side</th>
                <th>Right Hand Side</th>
            </tr>
        </thead>
        <tbody itemscope=LRSync>
            <tr>
                <td data-side=lhs>
                    <details open itemscope=CompDirInfo
                        be-observant="of onlyYoursExists onlyMineExists weMatch nameToDisplay hasContentToDisplay path and isOddItem" 
                        be-enhancing="
                            #lhsDirPick with 📁⛏️ and set $0+ish?.myHandle to directoryHandle.
                            #rhsDirPick with 📁⛏️ and set $0+ish?.yourHandle to directoryHandle.
                        " #>
                        <summary itemprop=nameToDisplay></summary>
                        <template -id defer-🎚️ 🎚️="on when #{{CompDirInfo}}." rel=preload src=#dirs-files></template>
                    </details>
                </td>
                <td data-side=rhs>
                    <details open disabled itemscope=CompDirInfo
                        be-observant="of onlyYoursExists onlyMineExists weMatch nameToDisplay hasContentToDisplay path and isOddItem" 
                        be-enhancing="
                            #rhsDirPick with 📁⛏️ and set $0+ish?.myHandle to directoryHandle.
                            #lhsDirPick with 📁⛏️ and set $0+ish?.yourHandle to directoryHandle.
                        " #>
                        <summary itemprop=nameToDisplay></summary>
                        <template -id defer-🎚️ 🎚️="on when #{{CompDirInfo}}." rel=preload src=#dirs-files></template>
                    </details>
                </td>
            </tr>
        </tbody>
    </table>

    <script type=module>
        import 'folder-picker/📁⛏️.js';
        import 'be-enhancing/emc.js';

        import 'be-observant/👀.js';
        
        import 'per-each/emc.js';
        import { regIsh } from 'mount-observer/refid/regIsh.js';
        import 'be-switched/🎚️.js';

        import { CompDirInfo } from '/Model/CompDirInfo/CompDirInfo.js';
        regIsh(document.body, 'CompDirInfo', CompDirInfo);

        import { CompFileInfo } from '/Model/CompFileInfo/CompFileInfo.js';
        regIsh(document.body, 'CompFileInfo', CompFileInfo);

        import { LRSync } from '/Model/LRSync/LRSync.js';
        regIsh(document.body, 'LRSync', LRSync);

        import {Scope} from 'trans-render/froop/Scope.js';
        regIsh(document.body, 'Scope', Scope);

    </script>
</body>

</html>
